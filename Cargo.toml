[package]
name = "my-addon-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
gix = { version = "0.88.0", features = [
  "blocking-http-transport-reqwest-rust-tls",
  "revision",
  "attributes",
  "dirwalk",
  "blob-diff",
  "status",
  "worktree-mutation",
  "notes",
  "mailmap",
] }
napi = "3"
napi-derive = "3"

[build-dependencies]
napi-build = "2"
